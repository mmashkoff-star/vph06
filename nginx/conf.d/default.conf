# Зона для формы заявки: с внешнего контура только сюда.
limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;
# Посекундные метрики с формы: 1 запрос/сек на вкладку, несколько вкладок с одного IP.
limit_req_zone $binary_remote_addr zone=metrics:5m rate=10r/s;

map $request_uri $deluxe_access_log {
    default 1;
    ~*^/healthz 0;
}

# Публичный контур: статика фронта + /api только через Nginx.
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 8m;
    access_log /dev/stdout combined if=$deluxe_access_log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag noindex always;

    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        return 302 /admin.html;
    }

    location = /admin/ {
        return 302 /admin.html;
    }

    location = /login {
        return 302 /login.html;
    }

    location = /login/ {
        return 302 /login.html;
    }

    location = /users {
        return 302 /users.html;
    }

    location = /users/ {
        return 302 /users.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /docs { return 404; }
    location ^~ /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Backend слушает только сеть app. С хоста :8000 нет.
    location ^~ /api/behavior-metrics {
        limit_req zone=metrics burst=20 nodelay;
        client_body_buffer_size 256k;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /api/ {
        limit_req zone=leads burst=20 nodelay;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /pgadmin { return 404; }
    location /pgadmin/ { return 404; }
}
